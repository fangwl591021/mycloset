name = "mycloset"
main = "src/worker.js"
compatibility_date = "2026-05-29"
preview_urls = false

assets = { directory = "public", binding = "ASSETS" }

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
PUBLIC_BASE_URL = "https://mycloset.fangwl591021.workers.dev"
FACE_SIMILARITY_THRESHOLD = "0.80"
AI_PROVIDER = "stub"
OPENAI_BASE_URL = "https://api.openai.com/v1"
