<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Closet AI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <strong>My Closet AI</strong>
        <span>AI 真人虛擬試穿 SaaS</span>
      </div>
      <div class="login-tools">
        <span id="loginStatus" class="login-status">LINE Login 尚未初始化</span>
        <button id="lineLoginButton" type="button">LINE Login</button>
        <button id="lineLogoutButton" type="button" hidden>登出</button>
        <a class="quick-link" href="#externalImport">匯入商品</a>
      </div>
      <div class="admin-tools">
        <label>
          管理 Token
          <input id="adminToken" type="password" autocomplete="off" placeholder="ADMIN_API_TOKEN">
        </label>
        <button id="saveAdminToken" type="button">套用</button>
        <button id="refreshOverview" type="button">更新後台</button>
        <span id="adminStatus" class="admin-status" role="status">尚未驗證</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p>讓顧客先穿，再下單。</p>
          <h1>看見自己穿上的樣子，才是真正的成交開始。</h1>
        </div>
        <div class="tryon-panel">
          <div class="phone-preview">
            <div class="model-shape"></div>
            <div class="garment-shape"></div>
          </div>
          <form id="tryonForm">
            <label>
              使用者 ID
              <input name="user_id" value="demo-user-001" required>
            </label>
            <label>
              Avatar ID
              <input name="avatar_id" value="demo-avatar-001" required>
            </label>
            <label>
              商品 ID
              <input name="product_id" value="cloth001" required>
            </label>
            <button type="submit">立即試穿</button>
          </form>
          <pre id="tryonResult">等待試穿任務</pre>
          <form id="outfitForm">
            <label>
              穿搭風格
              <select name="style">
                <option value="business">商務</option>
                <option value="date">約會</option>
                <option value="street">街頭</option>
                <option value="korean">韓系</option>
                <option value="japanese">日系</option>
              </select>
            </label>
            <label>
              投稿描述
              <input name="description" value="商務休閒風">
            </label>
            <button type="submit">投稿穿搭</button>
          </form>
          <pre id="outfitResult">完成試穿後可投稿</pre>
        </div>
      </section>

      <section class="workflow">
        <article>
          <h2>建立個人模特兒</h2>
          <form id="avatarForm" class="grid-form">
            <label>
              使用者 ID
              <input name="user_id" value="demo-user-001" required>
            </label>
            <label>
              Face ID
              <input name="face_id" value="demo-face-001" required>
            </label>
            <label>
              正面照
              <input name="photo_front" type="file" accept="image/jpeg,image/png,image/webp" required>
            </label>
            <label>
              左 45 度
              <input name="photo_left_45" type="file" accept="image/jpeg,image/png,image/webp" required>
            </label>
            <label>
              右 45 度
              <input name="photo_right_45" type="file" accept="image/jpeg,image/png,image/webp" required>
            </label>
            <label>
              全身照
              <input name="photo_full_body" type="file" accept="image/jpeg,image/png,image/webp" required>
            </label>
            <label>
              身形
              <select name="body_type">
                <option value="normal">一般</option>
                <option value="slim">偏瘦</option>
                <option value="curvy">曲線</option>
              </select>
            </label>
            <label>
              膚色
              <select name="skin_tone">
                <option value="warm">暖色</option>
                <option value="cool">冷色</option>
                <option value="neutral">中性</option>
              </select>
            </label>
            <label>
              髮型
              <input name="hair_style" value="short" required>
            </label>
            <label>
              狀態
              <select name="status">
                <option value="ready">ready</option>
                <option value="draft">draft</option>
              </select>
            </label>
            <button type="submit">儲存 Avatar</button>
          </form>
          <div id="avatarResult" class="form-result">尚未建立 Avatar</div>
        </article>

        <article>
          <h2>會員狀態</h2>
          <div class="user-actions">
            <button id="refreshPoints" type="button">查點數</button>
            <button id="refreshEligibility" type="button">查大使資格</button>
          </div>
          <pre id="memberResult">等待查詢</pre>
        </article>
      </section>

      <section class="stylist">
        <article>
          <h2>AI 穿搭顧問</h2>
          <form id="stylistForm" class="grid-form">
            <label>
              使用者 ID
              <input name="user_id" value="demo-user-001" required>
            </label>
            <label>
              商品 ID
              <input name="product_id" value="cloth001">
            </label>
            <label>
              場合
              <select name="occasion">
                <option value="商務會議">商務會議</option>
                <option value="約會">約會</option>
                <option value="直播導購">直播導購</option>
                <option value="日常休閒">日常休閒</option>
              </select>
            </label>
            <label>
              偏好
              <input name="preference" value="俐落、顯瘦、好活動">
            </label>
            <button type="submit">產生建議</button>
          </form>
          <pre id="stylistResult">等待產生穿搭建議</pre>
        </article>
      </section>

      <section class="storage-tool">
        <article>
          <h2>檔案上傳網址</h2>
          <form id="storageForm" class="grid-form">
            <label>
              Owner ID
              <input name="owner_id" value="demo-user-001" required>
            </label>
            <label>
              類型
              <select name="category">
                <option value="members">會員照片</option>
                <option value="products">商品圖片</option>
                <option value="tryons">試穿結果</option>
                <option value="outfits">穿搭投稿</option>
                <option value="reports">報表</option>
                <option value="temp">暫存</option>
              </select>
            </label>
            <label>
              檔名
              <input name="filename" value="photo-demo.jpg" required>
            </label>
            <label>
              方法
              <select name="method">
                <option value="PUT">上傳 PUT</option>
                <option value="GET">下載 GET</option>
              </select>
            </label>
            <button type="submit">產生短效網址</button>
          </form>
          <pre id="storageResult">尚未產生網址</pre>
        </article>
      </section>

      <section id="externalImport" class="import-tool">
        <article>
          <div class="section-head">
            <h2>貼網址匯入測試商品</h2>
            <span class="section-note">支援 Amazon、淘寶、天貓或一般商品頁；抓不到資料時可手動補名稱與圖片。</span>
          </div>
          <form id="externalProductForm" class="grid-form">
            <label class="wide-field">
              商品網址
              <input name="source_url" placeholder="貼上 Amazon / 淘寶 / 天貓商品網址" required>
            </label>
            <label>
              分類
              <select name="category">
                <option value="jacket">外套</option>
                <option value="top">上衣</option>
                <option value="pants">長褲</option>
                <option value="dress">洋裝</option>
                <option value="shoes">鞋子</option>
                <option value="accessory">配件</option>
              </select>
            </label>
            <label>
              名稱（可空白）
              <input name="name" placeholder="抓不到標題時才需要填">
            </label>
            <label>
              圖片網址（可空白）
              <input name="image_url" placeholder="抓不到圖片時可貼圖片網址">
            </label>
            <label>
              價格（可空白）
              <input name="price" type="number" placeholder="0">
            </label>
            <button type="submit">匯入商品</button>
          </form>
          <div id="externalProductResult" class="import-result">等待貼上商品網址</div>
        </article>
      </section>

      <section class="catalog">
        <div class="section-head">
          <h2>商品清單</h2>
          <button id="refreshProducts" type="button">重新整理商品</button>
        </div>
        <div id="productList" class="product-list"></div>
      </section>

      <section class="outfit-wall">
        <div class="section-head">
          <h2>穿搭牆</h2>
          <div>
            <select id="outfitFilter">
              <option value="">全部</option>
              <option value="pending">待審核</option>
              <option value="approved">已通過</option>
              <option value="rejected">已拒絕</option>
            </select>
            <button id="refreshOutfits" type="button">重新整理穿搭</button>
          </div>
        </div>
        <div id="outfitList" class="outfit-list"></div>
      </section>

      <section class="dashboard">
        <article>
          <h2>後台總覽</h2>
          <div id="overview" class="metrics"></div>
        </article>

        <article>
          <h2>新增商品</h2>
          <form id="productForm" class="grid-form">
            <label>
              名稱
              <input name="name" value="商務西裝外套" required>
            </label>
            <label>
              品牌
              <input name="brand" value="BrandA">
            </label>
            <label>
              分類
              <select name="category">
                <option value="jacket">外套</option>
                <option value="top">上衣</option>
                <option value="pants">長褲</option>
                <option value="dress">洋裝</option>
                <option value="shoes">鞋子</option>
                <option value="accessory">配件</option>
              </select>
            </label>
            <label>
              顏色
              <input name="color" value="navy">
            </label>
            <label>
              價格
              <input name="price" type="number" value="3990">
            </label>
            <label>
              商品圖片網址
              <input name="image_url" placeholder="抓不到圖片時可手動貼上">
            </label>
            <button type="submit">新增</button>
          </form>
          <pre id="productResult">尚未新增商品</pre>
        </article>
      </section>
    </main>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
